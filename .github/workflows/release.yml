name: Release

on:
  push:
    tags: ['v*']

# Required repository secrets — without all four the build fails at the decode step
# rather than publishing an APK no device will install:
#   RELEASE_KEYSTORE_BASE64    the upload keystore, `base64 -w0 release.jks`
#   RELEASE_KEYSTORE_PASSWORD  its store password
#   RELEASE_KEY_ALIAS          the signing key's alias inside that keystore
#   RELEASE_KEY_PASSWORD       that key's password

# A tag is a unique ref, so this only catches the same tag being pushed twice. It must
# not cancel: a half-published release is worse than a duplicate run that fails.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # assembleRelease derives versionCode from this name, and a name it cannot
          # parse would ship as code 1 and block every later install. Reject it here,
          # where the only cost is deleting a tag.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # v1.0.0-beta1 publishes as a prerelease, so it never becomes "latest".
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::secret RELEASE_KEYSTORE_BASE64 is not set; see the header of this workflow"
            exit 1
          fi
          # $RUNNER_TEMP is outside the workspace, so no later step can archive the key.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # A tag can point at any commit, not only one that passed CI on main, so the gate
      # runs again here. The emulator suite is deliberately left to ci.yml: it guards
      # merges, and repeating it would double the time to publish.
      - name: Lint and unit test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew lint test -Pchorely.versionName="$VERSION" --stacktrace

      - name: Assemble the signed release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHORELY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          CHORELY_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CHORELY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CHORELY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pchorely.versionName="$VERSION" --stacktrace

      # If the signing config was not picked up, AGP quietly emits app-release-unsigned.apk
      # instead of failing. Assert on the artifact rather than trusting the build.
      - name: Verify the APK is signed
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          apk="$RUNNER_TEMP/chorely-$VERSION.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          flags=(--title "Chorely $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "${flags[@]}"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
