name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer worthless; an emulator run is
# expensive enough that finishing it anyway is a waste.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Checks the wrapper jar against the published checksums, so a tampered
          # wrapper cannot execute arbitrary code in CI.
          validate-wrappers: true

      # `build` already depends on lint and test, but naming all three keeps the
      # command identical to the pre-push gate in AGENTS.md.
      - name: Build, lint and unit test
        run: ./gradlew build lint test --stacktrace

      # Instrumented tests are compiled here rather than in the emulator job so a
      # compile error is reported in about a minute instead of after a boot.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  instrumented-tests:
    name: instrumented-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image ships KVM but leaves it root-only; without this the
      # emulator silently falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 26 is the app's minSdk: if the Room store works anywhere, it has to work
      # on the oldest device the manifest admits.
      - name: Room store tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :core:data:connectedDebugAndroidTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            core/data/build/reports/
            core/data/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
